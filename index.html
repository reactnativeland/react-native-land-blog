<!doctype html>
<html lang="en">
  <head>
    <!-- Theme initialization script - Must run before body renders -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches;
        var resolved =
          stored === 'system' || !stored
            ? prefersDark
              ? 'dark'
              : 'light'
            : stored;
        document.documentElement.classList.add(resolved);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="React Native Land" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />

          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;

        src: url(https://fonts.bunny.net/outfit/files/outfit-latin-500-normal.woff2)
          format('woff2');

          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,

  <body>
    <div id="root">
      <!-- Inline skeleton for instant perceived loading -->
      <style>
        .dark #root:empty {
          min-height: 100vh;
          background: linear-gradient(to bottom, #121212 0%, #1a1a2e 100%);

        .light #root:empty {

          background: linear-gradient(to bottom, #f5f5f5 0%, #e8e8e8 100%);

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
